<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>days</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cg stroke='%23a39c90' stroke-width='1.6' stroke-linecap='round'%3E%3Cline x1='4' y1='3' x2='4' y2='13'/%3E%3Cline x1='8' y1='3' x2='8' y2='13'/%3E%3Cline x1='2.5' y1='12' x2='13.5' y2='4'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="fog" aria-hidden="true"></div>
  <main>
    <header id="counter">
      <p class="kicker">it&rsquo;s been</p>
      <p class="big"><span id="count">0</span><span class="unit">days</span></p>
      <p class="detail" id="detail"></p>
    </header>

    <section id="field" aria-label="hari demi hari">
      <div id="wall"></div>
    </section>
  </main>

  <svg id="ring" viewBox="0 0 40 40" aria-hidden="true">
    <circle cx="20" cy="20" r="16" pathLength="100"/>
  </svg>

  <div id="tip" hidden></div>
  <div id="abort">baik. angkanya masih berjalan.</div>

  <div id="veil" hidden>
    <div id="dialog" role="dialog" aria-modal="true"></div>
  </div>

  <div id="finale" hidden>
    <p class="selamat">selamat.</p>
    <p id="finale-line">penghitungan selesai.</p>
    <p class="damai">kamu sudah berdamai.</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
